name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      e2e_args:
        description: "Extra Playwright arguments for the E2E jobs (e.g. a spec file or --grep)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        if: matrix.browser == 'chromium'
        run: pnpm exec playwright install --with-deps chromium

      # Firefox extension pages can only be driven through WebDriver BiDi on a stock Firefox
      - name: Install Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Locate Firefox
        if: matrix.browser == 'firefox'
        run: |
          echo "FIREFOX_BIN=$(readlink -f "$(command -v firefox)")" >> "$GITHUB_ENV"
          firefox --version

      - name: Build and package extension
        run: pnpm run package

      - name: Run E2E tests
        run: xvfb-run -a pnpm exec playwright test --project=${{ matrix.browser }} --reporter=line --max-failures=5 $E2E_ARGS
        env:
          E2E_DEBUG: "1"
          E2E_ARGS: ${{ inputs.e2e_args }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  build:
    name: Build & package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate icons
        run: pnpm run icons

      - name: Package extension
        run: pnpm run package

      - name: Lint Firefox package
        run: pnpm exec web-ext lint --source-dir packages/firefox

      - name: Validate build
        run: |
          test -f icons/icon16.png || exit 1
          test -f icons/icon48.png || exit 1
          test -f icons/icon128.png || exit 1
          test -f packages/noobheaders-chrome.zip || exit 1
          test -f packages/noobheaders-firefox.zip || exit 1
          echo "✅ Icons and packages generated successfully"
